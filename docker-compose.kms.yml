# Master key in a KMS (OpenBao, the open-source Vault fork; same Transit API as HashiCorp Vault).
#
#   make kms-up      # start OpenBao, create the Transit key, move all data keys onto it
#
# The `openbao` service here runs in DEV MODE (in-memory, auto-unsealed, root token):
# good for trying the setup, NOT for production. In production, point VAULT_ADDR at your
# real Vault/OpenBao cluster, drop the `openbao` service, and put a least-privilege token
# (see app/crypto.py VaultTransit) in secrets/vault_token.
services:
  openbao:
    image: openbao/openbao:2.1.0
    restart: unless-stopped
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    environment: &kms-env
      WHARFLINE_KMS: vault
      VAULT_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      VAULT_TOKEN_FILE: /run/secrets/vault_token
    secrets: [master_keys, vault_token]
    depends_on:
      openbao:
        condition: service_healthy

  backend:
    environment: *kms-env
    secrets: [master_keys, vault_token]

secrets:
  vault_token:
    file: ./secrets/vault_token
