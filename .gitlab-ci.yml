# GitLab CI: Docker 이미지 빌드 확인 + 레지스트리 푸시
#
# 동작 요약
#   - MR / 일반 브랜치 push  → 이미지 빌드만 (푸시 안 함, 빌드 성공 여부 확인용)
#   - 기본 브랜치(main) push → 빌드 + GitLab Container Registry에 푸시 (커밋 SHA 태그 + latest)
#   - Git 태그 push          → 빌드 + 푸시 (Git 태그 이름을 이미지 태그로 사용)
#
# 자세한 설정 순서는 docs/gitlab-ci-image-build.md 참고.

# 같은 커밋에 대해 "브랜치 파이프라인"과 "MR 파이프라인"이 중복 실행되지 않게 함
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build

variables:
  # Docker-in-Docker(dind)를 TLS로 연결하기 위한 설정 (GitLab 권장값)
  DOCKER_TLS_CERTDIR: "/certs"
  # Dockerfile 위치를 바꾸려면 여기만 수정
  DOCKERFILE: Dockerfile
  BUILD_CONTEXT: .

# 공통 설정: docker CLI 이미지 + dind 서비스
.docker:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info

# 1) 빌드 확인 전용 (MR, main 이외 브랜치)
build-check:
  extends: .docker
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - docker build -f "$DOCKERFILE" -t "$CI_REGISTRY_IMAGE:check-$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"

# 2) 빌드 + 푸시 (main 브랜치, Git 태그)
build-push:
  extends: .docker
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    # CI_REGISTRY_* 변수는 GitLab이 자동으로 넣어줌 (별도 설정 불필요)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -f "$DOCKERFILE" -t "$CI_REGISTRY_IMAGE:$TAG" "$BUILD_CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    # main 브랜치일 때만 latest 태그도 갱신
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
