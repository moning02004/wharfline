services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wharfline
      POSTGRES_USER: wharfline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wharfline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wharfline -d wharfline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: waits for the DB, applies migrations, seeds an empty DB, then exits.
  # The API only starts after this succeeds, so API replicas never race on migrations.
  migrate:
    build: ./backend
    image: wharfline-backend
    command: ["python", "-m", "app.prestart"]
    restart: "no"
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://wharfline:${POSTGRES_PASSWORD:-wharfline}@db:5432/wharfline
      WHARFLINE_MASTER_KEYS_FILE: /run/secrets/master_keys
    secrets: [master_keys]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: wharfline-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
    secrets: [master_keys]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  frontend:
    build: ./frontend
    image: wharfline-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

# Master keys for envelope encryption. Created by `make keygen`, never committed.
# Mounted read-only at /run/secrets/master_keys; not visible in `docker inspect`.
secrets:
  master_keys:
    file: ./secrets/master_keys

volumes:
  pgdata:
